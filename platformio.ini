; When ready to integrate the MCP9808 sensors, follow these steps:
;
; 1. Copy this exact phrase:
;    My MCP9808 modules arrived, let's start testing.
;
; 2. Go to the Continue chat panel and type:
;    Read
;
; 3. Type the '@' symbol. When the file dropdown box pops up, select:
;    project_blueprint.prompt.md
