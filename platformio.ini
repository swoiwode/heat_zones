; =====================================================================
; QUICK MEMORY / REMINDER: HOW TO PROMPT CONTINUE WITH BLUEPRINT
; =====================================================================
; When ready to integrate the MCP9808 sensors, follow these steps:
;
; 1. Copy this exact phrase:
;    My MCP9808 modules arrived, let's start testing.
;
; 2. Go to the Continue chat panel and type:
;    Read
;
; 3. Type the '@' symbol. When the file dropdown box pops up, select:
;    project_blueprint.prompt.md
;
; 4. Paste the text copied from Step 1 right after that file token/pill.
;
; Final prompt input state will resemble:
; Read @project_blueprint.prompt.md My MCP9808 modules arrived, let's start testing.
; =====================================================================
;
; PlatformIO Project Configuration File
; https://platformio.org

; =====================================================================
; CENTRALIZED VARIABLE CONTAINER (THE ONE-TIME EDIT ZONE)
; =====================================================================
[custom_variables]
system_prefix = HZ-
wifi_ssid = eero_JELP
wifi_password = slimjim314
; =====================================================================

; --- Global Shared Configurations ---
[env] 
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

; Force compiler to acknowledge 8MB Flash limits
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
board_build.arduino.upstream_packages = no

; Shared Libraries Cluster
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    adafruit/Adafruit MCP9808 Library @ ^2.0.2
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit GFX Library @ ^1.11.7
    adafruit/Adafruit SSD1306 @ ^2.5.13

upload_flags = --after=hard_reset

; Global Macro Injector (Inheritable Base Flags Array)
build_flags =
    -D WIFI_SSID='"${custom_variables.wifi_ssid}"'
    -D WIFI_SECRET_KEY='"${custom_variables.wifi_password}"'
    -D CORE_DEBUG_LEVEL=0

; --- Individual Board Environments ---
[env:board_00]
upload_port = COM9
monitor_port = COM9
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D NODE_NUMBER='"00"'
    -D MY_KNOWN_LOCAL_NAME='"${custom_variables.system_prefix}SERVER"'

